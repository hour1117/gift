<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="神秘礼盒 - 选一个打开，看看属于你的惊喜">
<meta property="og:title" content="🎁 神秘礼盒">
<meta property="og:description" content="选一个打开，看看属于你的惊喜">
<meta property="og:type" content="website">
<title>🎁 神秘礼盒</title>
<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  min-height: 100vh;
  background: linear-gradient(160deg, #06061a 0%, #0f0f2e 25%, #1a1040 50%, #0a0a20 75%, #06061a 100%);
  overflow-x: hidden;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* ===== Floating Stars Background ===== */
.stars {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
}
.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  animation: twinkle var(--dur) ease-in-out infinite;
  animation-delay: var(--delay);
  opacity: 0;
}
.star.shooting {
  animation: shootStar 1.5s linear forwards;
  width: 2px !important;
  height: 2px !important;
  box-shadow: 0 0 6px 2px rgba(255,255,255,0.8);
}
@keyframes twinkle {
  0%, 100% { opacity: 0.15; transform: scale(1); }
  50% { opacity: 0.9; transform: scale(1.8); }
}
@keyframes shootStar {
  0% { transform: translate(0, 0); opacity: 1; }
  70% { opacity: 1; }
  100% { transform: translate(var(--sx), var(--sy)); opacity: 0; }
}

/* ===== Main Container ===== */
.container {
  position: relative; z-index: 1;
  max-width: 960px; margin: 0 auto; padding: 30px 20px 60px;
}

/* ===== Header ===== */
.header {
  text-align: center; margin-bottom: 40px; padding-top: 20px;
}
.header h1 {
  font-size: 3em;
  background: linear-gradient(180deg, #f5d98e 0%, #e8c97a 20%, #c49a5c 50%, #a0783c 80%, #c49a5c 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
  letter-spacing: 3px;
  filter: drop-shadow(0 2px 12px rgba(232,201,122,0.3));
  line-height: 1.3;
}
.header .subtitle {
  font-size: 1.1em; color: rgba(255,255,255,0.55); letter-spacing: 2px;
}
.header .subtitle .sparkle {
  display: inline-block;
  animation: emojiBounce 1.5s ease-in-out infinite;
}
.header .opened-hint {
  display: none;
  margin-top: 14px; padding: 10px 24px;
  background: rgba(232,201,122,0.08); border-radius: 24px;
  color: #e8c97a; font-size: 0.95em;
  border: 1px solid rgba(232,201,122,0.2);
  animation: hintPulse 3s ease-in-out infinite;
}
@keyframes hintPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(232,201,122,0.1); }
  50% { box-shadow: 0 0 18px 4px rgba(232,201,122,0.18); }
}

/* ===== Reset Link Banner ===== */
.reset-banner {
  display: none;
  margin: 0 auto 24px; max-width: 500px;
  padding: 14px 20px;
  background: rgba(100,180,255,0.08); border: 1px solid rgba(100,180,255,0.2);
  border-radius: 14px; text-align: center;
  color: rgba(255,255,255,0.75); font-size: 0.9em;
  animation: fadeIn 0.6s ease;
}
.reset-banner .reset-link { display: block; margin-top: 6px; color: #6ea8fe; font-size: 0.85em; word-break: break-all; }
.reset-banner.success { display: block; background: rgba(117,183,152,0.1); border-color: rgba(117,183,152,0.3); }

/* ===== Code Input (加抽码) ===== */
.code-section {
  display: none;
  margin: 0 auto 20px; max-width: 380px;
  padding: 16px 20px;
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px; text-align: center;
}
.code-section.show { display: block; animation: fadeIn 0.5s ease; }
.code-section .code-label {
  color: rgba(255,255,255,0.55); font-size: 0.85em; margin-bottom: 10px;
}
.code-input-row {
  display: flex; gap: 8px; justify-content: center;
}
.code-input-row input {
  width: 140px; padding: 10px 14px;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15);
  border-radius: 10px; color: white; font-size: 1.2em; text-align: center;
  letter-spacing: 4px; outline: none; font-family: 'Courier New', monospace;
  transition: border-color 0.3s;
}
.code-input-row input:focus { border-color: rgba(232,201,122,0.5); }
.code-input-row input::placeholder { letter-spacing: 1px; font-size: 0.7em; }
.btn-code {
  padding: 10px 20px; border-radius: 10px; border: none;
  background: linear-gradient(135deg, #75b798, #4d8a6e);
  color: white; font-size: 0.9em; font-weight: 600; cursor: pointer;
  transition: all 0.3s;
}
.btn-code:hover { filter: brightness(1.15); transform: translateY(-1px); }

/* ===== Gift Box Grid ===== */
.gift-grid {
  display: flex; flex-wrap: wrap; justify-content: center;
  gap: 50px 60px; padding: 20px 0;
}

/* ===== Gift Box Wrapper ===== */
.gift-box-wrapper {
  display: flex; flex-direction: column; align-items: center;
  cursor: pointer; transition: transform 0.35s ease, opacity 0.5s ease;
  position: relative;
}
.gift-box-wrapper:hover .gift-box { transform: translateY(-10px); }
.gift-box-wrapper:hover .box-glow { opacity: 1; transform: translateX(-50%) scale(1.3); }
.gift-box-wrapper.opened-box {
  cursor: not-allowed; opacity: 0.35; pointer-events: none;
}
.gift-box-wrapper.opened-box .orbiting-sparkles { display: none; }
.gift-box-wrapper.shaking .gift-box { animation: boxShake 0.5s ease-in-out; }
.gift-box-wrapper.opened-by-me { opacity: 1 !important; cursor: pointer !important; pointer-events: auto !important; }

/* ===== Orbiting Sparkles ===== */
.orbiting-sparkles {
  position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
  width: 180px; height: 150px; pointer-events: none; z-index: 0;
}
.orbit-sparkle {
  position: absolute;
  width: 4px; height: 4px;
  background: var(--sparkle-color, #e8c97a);
  border-radius: 50%;
  box-shadow: 0 0 6px 2px var(--sparkle-color, #e8c97a);
  animation: orbit var(--orbit-dur, 3s) linear infinite;
  animation-delay: var(--orbit-delay, 0s);
  top: 50%; left: 50%;
}
@keyframes orbit {
  0% { transform: translate(-50%, -50%) rotate(0deg) translateX(var(--orbit-r, 80px)) rotate(0deg); opacity: 0.3; }
  50% { opacity: 1; }
  100% { transform: translate(-50%, -50%) rotate(360deg) translateX(var(--orbit-r, 80px)) rotate(-360deg); opacity: 0.3; }
}

.gift-box {
  position: relative; width: 150px; height: 140px;
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 1;
  perspective: 500px;
  transform-style: preserve-3d;
}

/* Box glow */
.box-glow {
  position: absolute; bottom: -24px; left: 50%; transform: translateX(-50%);
  width: 110px; height: 24px;
  background: var(--glow-color);
  border-radius: 50%; filter: blur(18px);
  opacity: 0.45; transition: all 0.4s ease;
  z-index: 0;
}

/* Box Body */
.box-body {
  position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 136px; height: 110px;
  background: var(--box-color);
  border-radius: 10px;
  box-shadow:
    0 10px 30px rgba(0,0,0,0.5),
    0 0 0 2px var(--box-edge, rgba(255,255,255,0.1)),
    inset 0 2px 0 rgba(255,255,255,0.15),
    inset 0 -6px 0 rgba(0,0,0,0.12);
  z-index: 1;
}

/* Ribbons */
.ribbon-v {
  position: absolute; left: 50%; top: 0; transform: translateX(-50%);
  width: 22px; height: 100%; background: var(--ribbon-color);
  border-radius: 3px;
  box-shadow: inset 0 2px 0 rgba(255,255,255,0.3), 0 2px 6px rgba(0,0,0,0.2);
  z-index: 3;
}
.ribbon-h {
  position: absolute; top: 50%; left: 0; transform: translateY(-50%);
  width: 100%; height: 22px; background: var(--ribbon-color);
  border-radius: 3px;
  box-shadow: inset 0 2px 0 rgba(255,255,255,0.3), 0 2px 6px rgba(0,0,0,0.2);
  z-index: 3;
}
.ribbon-cross {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  width: 24px; height: 24px; background: var(--ribbon-color);
  border-radius: 4px; z-index: 4;
  box-shadow: inset 1px 1px 0 rgba(255,255,255,0.3);
}

/* Box Lid */
.box-lid {
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 150px; height: 26px;
  background: var(--lid-color);
  border-radius: 12px 12px 4px 4px;
  box-shadow:
    0 6px 16px rgba(0,0,0,0.35),
    inset 0 3px 0 rgba(255,255,255,0.25),
    0 0 0 1px rgba(255,255,255,0.08);
  z-index: 5;
  transform-origin: left bottom;
  transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.lid-ribbon {
  position: absolute; left: 50%; top: 0; transform: translateX(-50%);
  width: 22px; height: 100%; background: var(--ribbon-color);
  border-radius: 3px 3px 0 0; z-index: 6;
}

/* Bow */
.bow {
  position: absolute; top: -20px; left: 50%; transform: translateX(-50%); z-index: 7;
}
.bow::before, .bow::after {
  content: '';
  position: absolute;
  width: 30px; height: 20px;
  background: var(--ribbon-color);
  border-radius: 50%;
  box-shadow: inset 0 3px 0 rgba(255,255,255,0.35);
}
.bow::before { left: -26px; transform: rotate(-35deg); }
.bow::after  { left: -4px;  transform: rotate(35deg); }
.bow-center {
  width: 16px; height: 16px;
  background: var(--ribbon-color);
  border-radius: 50%;
  margin: 4px auto 0;
  box-shadow: 0 3px 6px rgba(0,0,0,0.3), inset 0 2px 0 rgba(255,255,255,0.4);
}

/* ===== Opening animation ===== */
.gift-box-wrapper.opening .box-lid {
  transform: translateX(-50%) translateY(-90px) rotate(-40deg);
  transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
.gift-box-wrapper.opening .gift-box { animation: boxPop 0.6s ease-out; }

/* Light beam on opening */
.light-beam {
  position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 60px; height: 0;
  background: linear-gradient(to top,
    rgba(255,215,0,0.9) 0%, rgba(255,200,80,0.6) 30%,
    rgba(255,255,200,0.3) 60%, transparent 100%);
  z-index: 0;
  border-radius: 50%;
  filter: blur(8px);
  pointer-events: none;
  animation: beamUp 1s ease-out forwards;
}
@keyframes beamUp {
  0% { height: 0; opacity: 0; }
  30% { height: 300px; opacity: 1; }
  100% { height: 500px; opacity: 0; }
}

/* Golden crack effect */
.golden-crack {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  width: 2px; height: 0;
  background: linear-gradient(to bottom, #ffd700, #ffaa00, transparent);
  z-index: 8;
  pointer-events: none;
  box-shadow: 0 0 10px 3px rgba(255,215,0,0.8);
  animation: crackGrow 0.6s ease-out forwards;
  animation-delay: 0.3s;
}
@keyframes crackGrow {
  0% { height: 0; opacity: 0; }
  50% { opacity: 1; }
  100% { height: 40px; opacity: 0; }
}

@keyframes boxShake {
  0%, 100% { transform: rotate(0); }
  15% { transform: rotate(-10deg); }
  30% { transform: rotate(10deg); }
  45% { transform: rotate(-7deg); }
  60% { transform: rotate(7deg); }
  75% { transform: rotate(-3deg); }
  90% { transform: rotate(3deg); }
}
@keyframes boxPop {
  0% { transform: scale(1); }
  40% { transform: scale(1.18); }
  100% { transform: scale(1); }
}

/* Box label */
.box-label {
  margin-top: 14px; font-size: 0.9em; color: rgba(255,255,255,0.45);
  letter-spacing: 2px; transition: color 0.3s;
}
.gift-box-wrapper:hover .box-label { color: rgba(255,255,255,0.85); }
.gift-box-wrapper.opened-box .box-label { color: rgba(255,255,255,0.25); }
.gift-box-wrapper.opened-by-me .box-label { color: #e8c97a !important; font-weight: 600; }

/* Opened badge */
.opened-badge {
  display: none; position: absolute; top: -8px; right: -8px; z-index: 10;
  width: 38px; height: 38px;
  background: rgba(255,255,255,0.1); border-radius: 50%;
  backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.12);
  font-size: 18px; line-height: 38px; text-align: center;
}
.gift-box-wrapper.opened-box .opened-badge { display: block; }
.gift-box-wrapper.opened-by-me .opened-badge { background: rgba(232,201,122,0.2); border-color: rgba(232,201,122,0.4); }

/* ===== 6 Color Themes (upgraded) ===== */
.gift-box-wrapper:nth-child(1) {
  --box-color: linear-gradient(180deg, #f0b0d0, #d4879e, #b86a82);
  --lid-color: #e090aa; --ribbon-color: #f8d0e4; --glow-color: rgba(240,176,208,0.5);
  --box-edge: rgba(255,200,220,0.25); --sparkle-color: #ffb0d0;
}
.gift-box-wrapper:nth-child(2) {
  --box-color: linear-gradient(180deg, #7eb8ff, #4a8ae0, #3060b0);
  --lid-color: #6098f0; --ribbon-color: #b0d4ff; --glow-color: rgba(126,184,255,0.5);
  --box-edge: rgba(150,200,255,0.25); --sparkle-color: #80c0ff;
}
.gift-box-wrapper:nth-child(3) {
  --box-color: linear-gradient(180deg, #80c8a0, #4d8a6e, #306050);
  --lid-color: #60b088; --ribbon-color: #b8e8d0; --glow-color: rgba(128,200,160,0.5);
  --box-edge: rgba(150,220,180,0.25); --sparkle-color: #80e0a0;
}
.gift-box-wrapper:nth-child(4) {
  --box-color: linear-gradient(180deg, #c0a0e0, #8e6dba, #6040a0);
  --lid-color: #a880d0; --ribbon-color: #e0d0f8; --glow-color: rgba(192,160,224,0.5);
  --box-edge: rgba(210,180,240,0.25); --sparkle-color: #c0a0f0;
}
.gift-box-wrapper:nth-child(5) {
  --box-color: linear-gradient(180deg, #f8b090, #d47e63, #b05040);
  --lid-color: #e89878; --ribbon-color: #fcd0c0; --glow-color: rgba(248,176,144,0.5);
  --box-edge: rgba(255,200,170,0.25); --sparkle-color: #ffb090;
}
.gift-box-wrapper:nth-child(6) {
  --box-color: linear-gradient(180deg, #f8e0a0, #dab840, #b09020);
  --lid-color: #e8c860; --ribbon-color: #fcf0c0; --glow-color: rgba(248,224,160,0.5);
  --box-edge: rgba(255,240,180,0.25); --sparkle-color: #ffe090;
}

/* ===== Particles ===== */
.particle {
  position: fixed; pointer-events: none; z-index: 100;
  font-size: 26px; animation: particleFly 1.4s ease-out forwards;
}
@keyframes particleFly {
  0% { opacity: 1; transform: translate(0, 0) scale(1) rotate(0deg); }
  100% { opacity: 0; transform: translate(var(--px), var(--py)) scale(0) rotate(var(--rot, 180deg)); }
}

/* ===== Card Overlay ===== */
.card-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.78);
  backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  z-index: 200;
  opacity: 0; pointer-events: none;
  transition: opacity 0.45s ease;
}
.card-overlay.active { opacity: 1; pointer-events: auto; }

@keyframes cardRise {
  from { transform: translateY(90px) scale(0.4) rotateY(15deg); opacity: 0; }
  to   { transform: translateY(0) scale(1) rotateY(0); opacity: 1; }
}

/* ===== Flip Card ===== */
.card-scene {
  perspective: 1400px;
  animation: cardRise 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}
.card-scene.flipped .card-inner { transform: rotateY(180deg); }

.card-inner {
  position: relative;
  width: 480px; height: 660px;
  transform-style: preserve-3d;
  transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
}

.card-front, .card-back {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  backface-visibility: hidden;
  border-radius: 22px;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center;
  padding: 40px 32px;
  text-align: center;
  box-shadow: 0 24px 64px rgba(0,0,0,0.55);
}

/* Shimmer border */
.card-front::before {
  content: ''; position: absolute; top: -3px; left: -3px; right: -3px; bottom: -3px;
  border-radius: 24px;
  background: linear-gradient(135deg,
    rgba(232,201,122,0.5), rgba(200,160,100,0.2), rgba(232,201,122,0.5),
    rgba(200,160,100,0.2), rgba(232,201,122,0.5));
  z-index: -1;
  background-size: 300% 300%;
  animation: shimmerBorder 3s linear infinite;
}
@keyframes shimmerBorder {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

.card-front {
  background: linear-gradient(150deg, #181428, #241e38, #1a1430);
  color: white;
}
.card-front .gift-emoji {
  font-size: 88px; margin-bottom: 16px;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
  animation: emojiBounce 1.2s ease-in-out infinite;
}
.card-front .gift-image {
  width: 100%; max-height: 400px; object-fit: contain;
  border-radius: 18px; margin-bottom: 14px;
  box-shadow: 0 10px 32px rgba(0,0,0,0.5);
  animation: emojiBounce 1.2s ease-in-out infinite;
}
@keyframes emojiBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}
.card-front .gift-name {
  font-size: 2.2em; font-weight: 700;
  background: linear-gradient(180deg, #f5d98e, #c49a5c);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}
.card-front .gift-desc {
  font-size: 1.1em; color: rgba(255,255,255,0.65);
  line-height: 1.7; margin-bottom: 28px;
}
.card-front .flip-hint {
  font-size: 0.85em; color: rgba(255,255,255,0.35);
  display: flex; align-items: center; gap: 8px;
}
.flip-hint .flip-arrow {
  display: inline-block;
  animation: flipPulse 1.5s ease-in-out infinite;
}
@keyframes flipPulse {
  0%, 100% { transform: rotateY(0); opacity: 0.4; }
  50% { transform: rotateY(180deg); opacity: 1; }
}

.card-back {
  background: linear-gradient(150deg, #2a1e28, #3c2e3a, #2a1e28);
  transform: rotateY(180deg);
}
.card-back::before {
  content: ''; position: absolute; top: -3px; left: -3px; right: -3px; bottom: -3px;
  border-radius: 24px;
  background: linear-gradient(135deg,
    rgba(220,180,140,0.45), rgba(180,140,100,0.15), rgba(220,180,140,0.45));
  z-index: -1;
  background-size: 300% 300%;
  animation: shimmerBorder 3s linear infinite reverse;
}
.card-back .blessing-label {
  font-size: 1em; color: #e8c97a; letter-spacing: 5px;
  margin-bottom: 28px; text-transform: uppercase;
}
.card-back .blessing-text {
  font-size: 1.4em; color: rgba(255,255,255,0.88);
  line-height: 2.2; letter-spacing: 1px;
  position: relative;
}
.card-back .blessing-text::before,
.card-back .blessing-text::after {
  content: '"'; font-size: 2.4em; color: rgba(220,180,140,0.35);
  position: absolute;
}
.card-back .blessing-text::before { top: -24px; left: -14px; }
.card-back .blessing-text::after  { bottom: -36px; right: -14px; }
.card-back .flip-back-hint {
  font-size: 0.8em; color: rgba(255,255,255,0.3); margin-top: 24px;
}

/* Close button */
.close-card {
  position: absolute; top: -54px; right: 0;
  width: 42px; height: 42px;
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18);
  border-radius: 50%; color: white; font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.3s;
}
.close-card:hover { background: rgba(255,255,255,0.2); transform: scale(1.1); }

/* ===== Confetti Canvas ===== */
#confetti-canvas {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 350;
}

/* ===== Confirmation Modal ===== */
.modal-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.72);
  backdrop-filter: blur(5px);
  display: flex; align-items: center; justify-content: center;
  z-index: 150; opacity: 0; pointer-events: none;
  transition: opacity 0.35s ease;
}
.modal-overlay.active { opacity: 1; pointer-events: auto; }

.modal-box {
  background: linear-gradient(145deg, #1a162e, #2a2440);
  border-radius: 22px; padding: 40px 36px 32px; text-align: center;
  max-width: 400px; width: 90%;
  border: 1px solid rgba(232,201,122,0.2);

// ==================== SOUND MANAGER ====================
class SoundManager {
  constructor() {
    this.ctx = null;
    this.initialized = false;
    this.enabled = true;
  }

  init() {
    if (this.initialized) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.initialized = true;
    } catch (e) {
      console.warn('Web Audio API 不可用');
      this.enabled = false;
    }
  }

  resume() {
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  _note(ctx, freq, type, start, duration, gainVal = 0.15, dest = null) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, start);
    gain.gain.setValueAtTime(gainVal, start);
    gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
    osc.connect(gain);
    gain.connect(dest || ctx.destination);
    osc.start(start);
    osc.stop(start + duration);
  }

  hover() {
    if (!this.enabled || !this.initialized) return;
    const ctx = this.ctx;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, now);
    osc.frequency.linearRampToValueAtTime(900, now + 0.1);
    gain.gain.setValueAtTime(0.06, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.15);
  }

  shake() {
    if (!this.enabled || !this.initialized) return;
    const ctx = this.ctx;
    const now = ctx.currentTime;
    for (let i = 0; i < 8; i++) {
      const t = now + i * 0.06;
      this._note(ctx, 80 + Math.random() * 60, 'triangle', t, 0.06, 0.08);
    }
  }

  open() {
    if (!this.enabled || !this.initialized) return;
    const ctx = this.ctx;
    const now = ctx.currentTime;

    // Sparkle chord
    const freqs = [523, 659, 784, 1047, 1319, 1568];
    freqs.forEach((f, i) => {
      const t = now + i * 0.06;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, t);
      gain.gain.setValueAtTime(0.1, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.9);
    });

    // Bass thump
    const bass = ctx.createOscillator();
    const bassGain = ctx.createGain();
    bass.type = 'sine';
    bass.frequency.setValueAtTime(120, now);
    bass.frequency.exponentialRampToValueAtTime(40, now + 0.3);
    bassGain.gain.setValueAtTime(0.25, now);
    bassGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    bass.connect(bassGain);
    bassGain.connect(ctx.destination);
    bass.start(now);
    bass.stop(now + 0.4);
  }

  flip() {
    if (!this.enabled || !this.initialized) return;
    const ctx = this.ctx;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(400, now);
    osc.frequency.linearRampToValueAtTime(200, now + 0.12);
    gain.gain.setValueAtTime(0.08, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.15);
  }

  celebrate() {
    if (!this.enabled || !this.initialized) return;
    const ctx = this.ctx;
    const now = ctx.currentTime;
    const melody = [523, 659, 784, 1047, 784, 1047, 1319];
    melody.forEach((f, i) => {
      this._note(ctx, f, 'sine', now + i * 0.1, 0.2, 0.07);
    });
  }
}

// ==================== OPEN BOX ====================
async function openBox(index) {
  confirmModal.classList.remove('active');

  const wrapper = giftGrid.querySelectorAll('.gift-box-wrapper')[index];
  if (!wrapper) return;

  const drawn = serverDrawn || isOpenedLocal();
  if (drawn && (serverOpenedIndex !== null ? serverOpenedIndex : getOpenedIndexLocal()) !== index) return;

  // Call API first
  const result = await apiDraw(index);
  if (!result.success) {
    if (result.alreadyDrawn) {
      showToast('你已经抽过了！同一IP只能抽一次 🎁');
      await checkServerStatus();
      renderBoxes();
    }
    return;
  }

  serverDrawn = true;
  serverOpenedIndex = index;
  markOpenedLocal(index);

  sound.init();
  sound.resume();

  // Phase 1: Shake + sound
  wrapper.classList.add('shaking');
  sound.shake();

  // Golden crack
  setTimeout(() => {
    const box = wrapper.querySelector('.gift-box');
    if (box) {
      const crack = document.createElement('div');
      crack.className = 'golden-crack';
      box.appendChild(crack);
      setTimeout(() => crack.remove(), 1000);
    }
  }, 300);

  // Phase 2: Open lid
  setTimeout(() => {
    wrapper.classList.remove('shaking');
    wrapper.classList.add('opening');
    sound.open();
    spawnParticles(wrapper);

    // Light beam
    const box = wrapper.querySelector('.gift-box');
    if (box) {
      const beam = document.createElement('div');
      beam.className = 'light-beam';
      box.appendChild(beam);
      setTimeout(() => beam.remove(), 1100);
    }
  }, 500);

  // Phase 3: Show card
  setTimeout(() => {
    showCard(index);
    startConfetti();
    sound.celebrate();
    renderBoxes();
  }, 1200);
}

// ==================== CONFETTI ====================
function resizeCanvas() {
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
}

const CONFETTI_COLORS = [
  '#e8c97a', '#d4a85c', '#e8a0bf', '#c9a0dc', '#75b798',
  '#b392d4', '#f0a58a', '#ff6b6b', '#51cf66', '#ffd43b',
  '#da77f2', '#4dabf7', '#ff922b', '#20c997'
];

function createConfettiPiece() {
  const isCircle = Math.random() < 0.35;
  return {
    x: Math.random() * confettiCanvas.width,
    y: -30,
    w: isCircle ? 0 : Math.random() * 12 + 5,
    h: isCircle ? 0 : Math.random() * 7 + 4,
    r: isCircle ? Math.random() * 5 + 2 : 0,
    isCircle,
    color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
    vx: (Math.random() - 0.5) * 5,
    vy: Math.random() * 3 + 2.5,
    rot: Math.random() * 360,
    rotSpeed: (Math.random() - 0.5) * 10,
    wobble: Math.random() * 3,
    opacity: 1,
  };
}

function startConfetti() {
  confettiRunning = true;
  confettiPieces = [];
  for (let i = 0; i < 100; i++) {
    const p = createConfettiPiece();
    p.x = confettiCanvas.width / 2 + (Math.random() - 0.5) * 240;
    p.y = confettiCanvas.height / 2;
    p.vy = (Math.random() - 0.5) * 14 - 5;
    p.vx = (Math.random() - 0.5) * 20;
    confettiPieces.push(p);
  }
  animateConfetti();

  setTimeout(() => { confettiRunning = false; }, 4000);
}

function animateConfetti() {
  if (!confettiRunning && confettiPieces.length === 0) return;

  ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

  confettiPieces = confettiPieces.filter(p => {
    p.x += p.vx + Math.sin(p.rot * 0.05) * p.wobble;
    p.vy += 0.15;
    p.y += p.vy;
    p.rot += p.rotSpeed;
    p.opacity -= 0.0025;

    if (p.opacity <= 0 || p.y > confettiCanvas.height + 30) return false;

    ctx.save();
    ctx.globalAlpha = p.opacity;
    ctx.translate(p.x, p.y);
    ctx.rotate((p.rot * Math.PI) / 180);

    if (p.isCircle) {
      ctx.beginPath();
      ctx.arc(0, 0, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
    } else {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.roundRect(-p.w / 2, -p.h / 2, p.w, p.h, 2);
      ctx.fill();
    }
    ctx.restore();
    return true;
  });

  if (confettiRunning && Math.random() < 0.5) {
    confettiPieces.push(createConfettiPiece());
  }

  requestAnimationFrame(animateConfetti);
}

async function handleResetToken() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('reset');
  if (!token) return;

  window.history.replaceState({}, document.title, window.location.pathname);

  const result = await apiUseResetToken(token);
  if (result.success) {
    serverDrawn = false;
    serverOpenedIndex = null;
    resetLocalState();
    resetBanner.className = 'reset-banner success';
    resetBannerMsg.textContent = '✅ 重置成功！你可以重新抽取礼盒了';
    resetBanner.style.display = 'block';
    renderBoxes();
    showToast('🎉 重置成功！请选择你的礼盒');
  } else {
    resetBanner.style.display = 'block';
    resetBannerMsg.textContent = '⚠️ ' + (result.message || '重置失败');
  }
}

  setInterval(() => {
    if (Math.random() < 0.3) spawnShootingStar();
  }, 4000);
}

window.addEventListener('resize', resizeCanvas);
window.addEventListener('load', init);

// Resume audio on first interaction
document.addEventListener('click', () => sound.resume(), { once: true });
document.addEventListener('touchstart', () => sound.resume(), { once: true });
</script>
